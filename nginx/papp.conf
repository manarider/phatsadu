# ========================================================
# PAPP Nginx Configuration
# เทศบาลนครนครสวรรค์ - ระบบบริหารจัดการพัสดุ
#
# URL: http://app.nsm.go.th/phatsadu/
#       http://192.168.100.15/phatsadu/
# Backend: localhost:4004
# Frontend build: /data/phatsadu/frontend/dist/
#
# วิธีใช้:
#   sudo ln -s /data/phatsadu/nginx/papp.conf /etc/nginx/sites-enabled/papp
#   sudo nginx -t && sudo systemctl reload nginx
# ========================================================

server {
    listen 80;
    server_name app.nsm.go.th 192.168.100.15;

    # ─── Gzip Compression ──────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/wasm;
    gzip_min_length 1024;
    gzip_vary on;

    # ─── Security Headers ──────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── API: Proxy → Node.js Backend Port 4004 ────
    # !! ต้องอยู่ก่อน location /phatsadu/ !!
    location ^~ /phatsadu/api/ {
        proxy_pass         http://127.0.0.1:4004/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # ไม่ cache API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ─── Uploads: Static Files from Backend ────────
    location ^~ /phatsadu/uploads/ {
        alias   /data/phatsadu/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;

        # ป้องกันรัน script ใน upload folder
        location ~* \.(php|py|js|sh|pl)$ {
            deny all;
        }
    }

    # ─── Frontend: React SPA ───────────────────────
    location /phatsadu/ {
        alias   /data/phatsadu/frontend/dist/;
        index   index.html;

        # Static assets (js, css, images) — cache นาน
        location ~* \.(js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|webp|gif)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # SPA fallback: route ทุกอย่างไป index.html
        try_files $uri $uri/ @phatsadu_spa;
    }

    # Named location สำหรับ SPA fallback
    location @phatsadu_spa {
        root  /data/phatsadu/frontend/dist;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ─── Redirect root to /phatsadu/ ───────────────
    location = / {
        return 301 /phatsadu/;
    }
}
